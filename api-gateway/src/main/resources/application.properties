spring.application.name=api-gateway
server.port=8080

# Eureka connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enable dynamic routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Canonical public auth API route through gateway
spring.cloud.gateway.mvc.routes[0].id=auth-service-api
spring.cloud.gateway.mvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

# Backward-compatible direct auth route
spring.cloud.gateway.mvc.routes[1].id=auth-service-direct
spring.cloud.gateway.mvc.routes[1].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/auth/**

# Route OAuth authorization start endpoints to auth-service
spring.cloud.gateway.mvc.routes[2].id=auth-service-oauth-start
spring.cloud.gateway.mvc.routes[2].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/oauth2/**

# Route OAuth callback endpoints to auth-service
spring.cloud.gateway.mvc.routes[3].id=auth-service-oauth-callback
spring.cloud.gateway.mvc.routes[3].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/login/oauth2/**

# Optional gateway-facing OAuth success helper
spring.cloud.gateway.mvc.routes[4].id=auth-service-oauth-success
spring.cloud.gateway.mvc.routes[4].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/oauth-success
spring.cloud.gateway.mvc.routes[4].filters[0]=SetPath=/auth/oauth-success

# CORS for local frontend apps
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
